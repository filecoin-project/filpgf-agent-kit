name: release

# Clients install the plugin from the default branch and update when its
# version changes, so a release is a version bump: `npm version <patch|minor|major>`
# updates package.json and both plugin manifests, commits and tags vX.Y.Z.
# Pushing the tag publishes a GitHub release with the plugin folder as a ZIP,
# for clients that upload a plugin instead of reading a marketplace.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # Read-only: all repository code runs here.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Tag matches the version and is on the default branch
        run: |
          test "v$(jq -r .version package.json)" = "$TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
      - name: Test and check
        run: |
          npm test
          npm run check
          npm run sync:check
      - name: Package the plugin folder
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          git archive --format=zip --prefix=filpgf/ -o "$RUNNER_TEMP/release/filpgf-${TAG#v}.zip" "$GITHUB_SHA:plugins/filpgf"
          (cd "$RUNNER_TEMP/release" && sha256sum -- *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  # Write job: runs no repository code. Uploads the tested assets to a new release.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum -c SHA256SUMS
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists; not replacing its assets"; exit 1; fi
          flags=(--verify-tag --title "$TAG" --generate-notes)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}" -- *
