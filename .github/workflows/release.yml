name: release

# Tag-triggered release. Pushing a tag vX.Y.Z (matching toolkit.json and
# package.json) tests, builds and validates the plugin, publishes a GitHub
# release with the plugin ZIP and SHA256SUMS and, when the tag is newer than
# the `stable` branch, commits dist/stable/ onto `stable`. Every client
# installs from that branch. Nothing is ever pushed to a source branch.
on:
  push:
    tags: ["v*"]

permissions: {}

# One release at a time, so two tags cannot race for the stable branch.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Read-only: all repository code runs here.
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      base: ${{ steps.decide.outputs.base }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
    env:
      TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All branches, so the default branch and the current stable branch can be inspected.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Tag matches toolkit.json and package.json
        run: node scripts/release.mjs verify-tag "$TAG"
      - name: Tagged commit is on the default branch
        run: git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
      - name: Unit and fixture tests (offline)
        run: npm test
      - name: Upstream imports still match their pinned hashes
        run: npm run imports:check
      - name: Build and validate
        run: |
          npm run build
          npm run validate
      - name: Decide whether the tag may replace the stable branch (never backwards)
        id: decide
        # bash -eo pipefail: a stable branch without a readable package.json fails the run instead of looking empty.
        shell: bash
        run: |
          if git rev-parse -q --verify refs/remotes/origin/stable >/dev/null; then
            base=$(git rev-parse refs/remotes/origin/stable)
            current=$(git show "$base:package.json" | jq -r .version)
          else
            base=""; current=""
          fi
          node scripts/release.mjs decide "$TAG" "$current" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          case "$TAG" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
      - name: Package the stable tree
        run: |
          mkdir -p "$RUNNER_TEMP/stable"
          (cd dist/packages && sha256sum -c SHA256SUMS)
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 -C dist/stable -cf "$RUNNER_TEMP/stable/stable-tree.tar" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/packages/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-tree
          path: ${{ runner.temp }}/stable/stable-tree.tar
          if-no-files-found: error

  # Write job: runs no repository code. Uploads the tested assets to a new release.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          ADVANCES_STABLE: ${{ needs.build.outputs.publish }}
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum -c SHA256SUMS
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists; not replacing its assets"; exit 1; fi
          flags=(--verify-tag --title "$TAG" --notes "Install from the \`stable\` branch: see the README. The ZIP holds the plugin folder for clients that upload a plugin. Verify it with \`sha256sum -c SHA256SUMS\`.")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if [ "$ADVANCES_STABLE" != true ]; then flags+=(--latest=false); fi
          gh release create "$TAG" "${flags[@]}" -- *

  # Write job: runs no repository code. Commits the tested tree on top of the
  # stable commit the build job inspected and pushes without force, so the push
  # fails if stable moved in the meantime and can never roll it backwards.
  stable:
    needs: [build, release]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stable-tree
          path: ${{ runner.temp }}/stable
      - name: Publish the stable branch
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          REMOTE_URL: https://github.com/${{ github.repository }}.git
          BRANCH: stable
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          BASE: ${{ needs.build.outputs.base }}
          TREE: ${{ runner.temp }}/stable/stable-tree.tar
        run: |
          # BEGIN publish-stable
          set -euo pipefail
          if [ "$BRANCH" != stable ] || [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then echo "refusing to publish to $BRANCH"; exit 1; fi
          work=$(mktemp -d)
          cd "$work"
          git init -q
          auth=()
          if [ -n "${TOKEN:-}" ]; then auth=(-c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"); fi
          tar -xf "$TREE"
          test "v$(jq -r .version package.json)" = "$TAG"
          git add -A
          parent=()
          if [ -n "$BASE" ]; then
            git "${auth[@]}" fetch -q --depth=1 "$REMOTE_URL" "$BASE"
            parent=(-p "$BASE")
          fi
          tree=$(git write-tree)
          commit=$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$tree" "${parent[@]}" -m "stable: $TAG" -m "Generated from $SOURCE_SHA by the release workflow.")
          git "${auth[@]}" push "$REMOTE_URL" "$commit:refs/heads/$BRANCH"
          # END publish-stable
