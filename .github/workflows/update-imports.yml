name: update-imports

# Daily: move upstream skill imports to the head of their tracked branch,
# re-record hashes, test, build and validate, then commit imports.lock.json
# directly to the default branch. See README "Daily upstream updates".
on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC every day
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-imports
  cancel-in-progress: false

jobs:
  # Read-only: resolves refs, fetches upstream blobs and runs this repository's
  # own tests and build. Upstream files are read as git blobs, never executed.
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Resolve tracked branches and re-pin (writes the lock only if every import passes)
        id: update
        run: |
          mkdir -p "$RUNNER_TEMP/update"
          node scripts/update-imports.mjs --message "$RUNNER_TEMP/update/commit-message.txt"
          if git diff --quiet -- imports.lock.json; then echo "changed=false"; else echo "changed=true"; fi >> "$GITHUB_OUTPUT"
      - name: Tests, build and validation with the updated lock
        if: steps.update.outputs.changed == 'true'
        run: |
          npm test
          npm run build
          npm run validate
          node scripts/build.mjs --out .cache/dist-oso --no-packages --enable-mcp oso
          node scripts/validate-dist.mjs .cache/dist-oso
      - name: Only imports.lock.json changed
        if: steps.update.outputs.changed == 'true'
        run: |
          git status --porcelain
          test "$(git status --porcelain)" = " M imports.lock.json"
          cp imports.lock.json "$RUNNER_TEMP/update/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.update.outputs.changed == 'true'
        with:
          name: updated-lock
          path: ${{ runner.temp }}/update/
          if-no-files-found: error
          retention-days: 7

  # The only job with write access. It runs no repository or upstream code:
  # it commits the validated lock on top of the exact commit that was tested.
  # The push is a fast-forward of the default branch, so it fails (and the
  # next day's run retries) if the branch moved in the meantime.
  commit:
    needs: update
    if: needs.update.outputs.changed == 'true' && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.base }}
          # Keeps GITHUB_TOKEN in this checkout's .git/config for the push below; no global git config is written.
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: updated-lock
          path: ${{ runner.temp }}/update
      - name: Commit imports.lock.json and push to the default branch
        id: push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          cp "$RUNNER_TEMP/update/imports.lock.json" imports.lock.json
          jq -e '.lockfileVersion == 1 and (.imports | length > 0)' imports.lock.json >/dev/null
          test "$(git status --porcelain)" = " M imports.lock.json"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -F "$RUNNER_TEMP/update/commit-message.txt" -- imports.lock.json
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Build, validate and upload artifacts for the pushed commit.
  ci:
    needs: commit
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.commit.outputs.sha }}
